{% extends "base.html" %}
{% block title %}New project - AgentFlow{% endblock %}
{% block content %}
  <h1>New project</h1>
  <form class="stacked" method="post" id="projectForm">
    <fieldset>
      <legend>Project details</legend>
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Description
        <textarea name="description" rows="4"></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>Primary repository location</legend>
      <label>Repository name
        <input type="text" name="repo_name" placeholder="e.g., main, src, codebase">
      </label>
      <label>Repository path
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="text" name="repo_path" id="repoPath" placeholder="e.g., /home/user/my-project">
          <button type="button" id="browseBtn" style="white-space: nowrap;">Browse</button>
        </div>
      </label>
    </fieldset>

    <button type="submit">Create project</button>
  </form>

  <div id="locationModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 2rem; border-radius: 8px; min-width: 500px; max-height: 80vh; display: flex; flex-direction: column;">
      <h2 style="margin-top: 0;">Select Repository Location</h2>

      <div style="margin-bottom: 1rem;">
        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
          <input type="text" id="currentPath" readonly style="flex: 1; padding: 0.5rem; background: #f5f5f5;">
          <button type="button" id="upBtn">↑ Up</button>
        </div>
      </div>

      <div id="dirList" style="flex: 1; overflow-y: auto; border: 1px solid #ddd; padding: 0.5rem; margin-bottom: 1rem; background: #f9f9f9;">
        <p>Loading...</p>
      </div>

      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button type="button" id="selectBtn">Select</button>
        <button type="button" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let currentBrowsePath = null;
    let selectedPath = null;

    const modal = document.getElementById('locationModal');
    const browseBtn = document.getElementById('browseBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const selectBtn = document.getElementById('selectBtn');
    const upBtn = document.getElementById('upBtn');
    const currentPathEl = document.getElementById('currentPath');
    const dirListEl = document.getElementById('dirList');
    const repoPathInput = document.getElementById('repoPath');

    browseBtn.addEventListener('click', () => {
      modal.style.display = 'block';
      currentBrowsePath = '/home/devadmin';
      selectedPath = currentBrowsePath;
      loadDirectory(currentBrowsePath);
    });

    cancelBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    selectBtn.addEventListener('click', () => {
      if (selectedPath) {
        repoPathInput.value = selectedPath;
      }
      modal.style.display = 'none';
    });

    upBtn.addEventListener('click', () => {
      if (currentBrowsePath && currentBrowsePath !== '/') {
        const parent = currentBrowsePath.substring(0, currentBrowsePath.lastIndexOf('/')) || '/';
        loadDirectory(parent);
      }
    });

    function loadDirectory(path) {
      currentBrowsePath = path;
      selectedPath = path;
      currentPathEl.value = path;
      dirListEl.innerHTML = '<p>Loading...</p>';

      fetch(`/api/directories?path=${encodeURIComponent(path)}`)
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            dirListEl.innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
            return;
          }

          const dirs = data.directories || [];
          if (dirs.length === 0) {
            dirListEl.innerHTML = '<p style="color: #999;">No subdirectories</p>';
          } else {
            dirListEl.innerHTML = dirs.map(dir => `
              <div style="padding: 0.5rem; cursor: pointer; border-radius: 4px; margin-bottom: 0.25rem;"
                   class="dir-item"
                   data-path="${dir.path}"
                   onmouseover="this.style.background='#e3f2fd'"
                   onmouseout="this.style.background='transparent'">
                📁 ${dir.name}
              </div>
            `).join('');

            document.querySelectorAll('.dir-item').forEach(el => {
              el.addEventListener('click', () => {
                loadDirectory(el.dataset.path);
              });
            });
          }
        })
        .catch(err => {
          dirListEl.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
        });
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });
  </script>
{% endblock %}
