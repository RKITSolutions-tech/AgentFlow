{% extends "base.html" %}

{% block content %}
<div class="dashboard-container" data-testid="dashboard-container">
  {% block dashboard_content %}{% endblock %}
</div>

<style>
.dashboard-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: var(--gap);
  width: 100%;
  box-sizing: border-box;
}

/* Mobile-first: single column, full width */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap);
  width: 100%;
}

.dashboard-section {
  display: flex;
  flex-direction: column;
  gap: calc(var(--gap) / 2);
}

.dashboard-section h2 {
  margin: 0 0 calc(var(--gap) / 2) 0;
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--text-primary);
}

.dashboard-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap);
  width: 100%;
}

.dashboard-card {
  background: var(--bg-secondary);
  border-radius: 6px;
  padding: var(--gap);
  min-height: 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.dashboard-card h3 {
  margin: 0 0 calc(var(--gap) / 2) 0;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-primary);
  word-wrap: break-word;
}

.dashboard-card p {
  margin: 0;
  font-size: 0.875rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.dashboard-card a {
  color: var(--link-color, #0066cc);
  text-decoration: none;
  word-break: break-word;
}

.dashboard-card a:hover {
  text-decoration: underline;
}

/* Tablet: 2 column layout */
@media (min-width: 768px) {
  .dashboard-grid {
    grid-template-columns: 1fr 1fr;
  }

  .dashboard-cards {
    grid-template-columns: 1fr;
  }
}

/* Desktop: 3 column layout with hierarchy (Sessions 50%, Pipelines 25%, Backlog 25%) */
@media (min-width: 1024px) {
  .dashboard-grid {
    grid-template-columns: 2fr 1fr 1fr;
  }

  .dashboard-cards {
    grid-template-columns: 1fr;
  }
}

/* Responsive padding adjustments */
@media (max-width: 860px) {
  .dashboard-container {
    padding: calc(var(--gap) / 2);
  }

  .dashboard-card {
    padding: calc(var(--gap) / 1.5);
  }
}

/* Touch-friendly targets */
.dashboard-card a {
  padding: calc(var(--tap) / 4);
  margin: -calc(var(--tap) / 4);
  min-height: var(--tap);
  display: flex;
  align-items: center;
}

/* Status badge - Color-coded by status */
.status-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-badge.running,
.status-badge.in-progress,
.status-badge.in_progress {
  background: #ff9800;
  color: #fff;
}

.status-badge.paused {
  background: #ff9800;
  color: #fff;
}

.status-badge.blocked {
  background: #f44336;
  color: #fff;
}

.status-badge.done,
.status-badge.completed {
  background: #4caf50;
  color: #fff;
}

.status-badge.selected {
  background: #2196f3;
  color: #fff;
}

/* Dashboard sidebar layout (for Wikis on desktop) */
.dashboard-sidebar-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap);
}

@media (min-width: 1024px) {
  .dashboard-sidebar-layout {
    grid-template-columns: 250px 1fr;
  }

  .dashboard-sidebar {
    display: flex;
    flex-direction: column;
    gap: calc(var(--gap) / 2);
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }

  .dashboard-preview {
    display: flex;
    flex-direction: column;
    gap: calc(var(--gap) / 2);
  }
}

/* Sidebar items */
.sidebar-item {
  padding: calc(var(--gap) / 2);
  border-radius: 4px;
  cursor: pointer;
  border-left: 3px solid transparent;
  color: var(--text-secondary);
  text-decoration: none;
  transition: all 0.2s ease;
}

.sidebar-item:hover {
  background: var(--bg-hover, rgba(255, 255, 255, 0.05));
  color: var(--text-primary);
}

.sidebar-item.active {
  background: var(--bg-tertiary, rgba(255, 255, 255, 0.08));
  color: var(--link-color, #0066cc);
  border-left-color: var(--link-color, #0066cc);
  font-weight: 500;
}

/* Project dashboard grid layout */
.project-dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap);
}

@media (min-width: 768px) {
  .project-dashboard-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (min-width: 1024px) {
  .project-dashboard-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Status summary cards */
.status-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: calc(var(--gap) / 2);
  margin-top: calc(var(--gap) / 2);
}

@media (min-width: 768px) {
  .status-summary {
    grid-template-columns: repeat(5, 1fr);
  }
}

.status-item {
  padding: calc(var(--gap) / 1.5);
  background: var(--bg-tertiary, rgba(255, 255, 255, 0.04));
  border-radius: 4px;
  text-align: center;
}

.status-item .count {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1;
}

.status-item .label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
}

/* Card actions */
.card-actions {
  display: flex;
  gap: var(--gap);
  margin-top: var(--gap);
  flex-wrap: wrap;
}

.card-action-btn {
  padding: 10px 16px;
  font-size: 0.9375rem;
  font-weight: 600;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-primary);
  text-decoration: none;
  transition: all 0.2s ease;
  white-space: nowrap;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}

.card-action-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.4);
}

.card-action-btn.primary {
  background: #2196f3;
  border-color: #2196f3;
  color: white;
  font-weight: 700;
}

.card-action-btn.primary:hover {
  background: #1976d2;
  box-shadow: 0 2px 8px rgba(33, 150, 243, 0.3);
}

.card-action-btn.secondary {
  background: #4caf50;
  border-color: #4caf50;
  color: white;
  font-weight: 700;
}

.card-action-btn.secondary:hover {
  background: #388e3c;
}

/* Section header with action button */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--gap);
}

.section-header h2 {
  margin: 0;
}
</style>
{% endblock %}
