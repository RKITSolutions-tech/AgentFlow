{% extends "base.html" %}

{% block content %}
<div class="dashboard-container" data-testid="dashboard-container">
  {% block dashboard_content %}{% endblock %}
</div>

<style>
.dashboard-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 16px;
  width: 100%;
  box-sizing: border-box;
}

/* Mobile-first: single column, full width */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  width: 100%;
}

.dashboard-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.dashboard-section h2 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}

.dashboard-section h1 {
  margin: 0;
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -1px;
}

.dashboard-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  width: 100%;
}

.dashboard-card {
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.2s ease;
}

.dashboard-card:hover {
  border-color: rgba(255, 255, 255, 0.16);
  background: var(--bg-secondary);
}

.dashboard-card h3 {
  margin: 0 0 8px 0;
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--text-primary);
  word-wrap: break-word;
}

.dashboard-card p {
  margin: 0;
  font-size: 0.9375rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

.dashboard-card a {
  color: var(--link-color, #0066cc);
  text-decoration: none;
  word-break: break-word;
}

.dashboard-card a:hover {
  text-decoration: underline;
}

/* 2-3 column layout on tablet and larger */
@media (min-width: 768px) {
  .dashboard-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .dashboard-cards {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* 3 column layout on desktop */
@media (min-width: 1024px) {
  .dashboard-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .dashboard-cards {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Responsive padding adjustments */
@media (max-width: 860px) {
  .dashboard-container {
    padding: calc(var(--gap) / 2);
  }

  .dashboard-card {
    padding: calc(var(--gap) / 1.5);
  }
}

/* Touch-friendly targets */
.dashboard-card a {
  padding: calc(var(--tap) / 4);
  margin: -calc(var(--tap) / 4);
  min-height: var(--tap);
  display: flex;
  align-items: center;
}

/* Status badge */
.status-badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-badge.running {
  background: #00ff00;
  color: #0f0f0f;
  box-shadow: 0 0 12px rgba(0, 255, 0, 0.3);
}

.status-badge.paused {
  background: #ffaa00;
  color: #0f0f0f;
  box-shadow: 0 0 12px rgba(255, 170, 0, 0.3);
}

.status-badge.blocked {
  background: #ff3366;
  color: #ffffff;
  box-shadow: 0 0 12px rgba(255, 51, 102, 0.3);
}

.status-badge.done {
  background: #6b7280;
  color: #ffffff;
}

.status-badge.active {
  background: #00d9ff;
  color: #0f0f0f;
  box-shadow: 0 0 12px rgba(0, 217, 255, 0.3);
}

/* Dashboard sidebar layout (for Wikis on desktop) */
.dashboard-sidebar-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap);
}

@media (min-width: 1024px) {
  .dashboard-sidebar-layout {
    grid-template-columns: 250px 1fr;
  }

  .dashboard-sidebar {
    display: flex;
    flex-direction: column;
    gap: calc(var(--gap) / 2);
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }

  .dashboard-preview {
    display: flex;
    flex-direction: column;
    gap: calc(var(--gap) / 2);
  }
}

/* Sidebar items */
.sidebar-item {
  padding: calc(var(--gap) / 2);
  border-radius: 4px;
  cursor: pointer;
  border-left: 3px solid transparent;
  color: var(--text-secondary);
  text-decoration: none;
  transition: all 0.2s ease;
}

.sidebar-item:hover {
  background: var(--bg-hover, rgba(255, 255, 255, 0.05));
  color: var(--text-primary);
}

.sidebar-item.active {
  background: var(--bg-tertiary, rgba(255, 255, 255, 0.08));
  color: var(--link-color, #0066cc);
  border-left-color: var(--link-color, #0066cc);
  font-weight: 500;
}

/* Project dashboard grid layout */
.project-dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap);
}

@media (min-width: 768px) {
  .project-dashboard-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (min-width: 1024px) {
  .project-dashboard-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Status summary cards */
.status-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 16px;
}

@media (min-width: 768px) {
  .status-summary {
    grid-template-columns: repeat(5, 1fr);
  }
}

.status-item {
  padding: 16px 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  text-align: center;
  transition: all 0.2s ease;
}

.status-item:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
}

.status-item .count {
  font-size: 2rem;
  font-weight: 800;
  color: #00d9ff;
  line-height: 1;
  display: block;
}

.status-item .label {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 8px;
  font-weight: 600;
}

/* Card actions */
.card-actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.card-action-btn {
  padding: 12px 20px;
  font-size: 1rem;
  font-weight: 600;
  background: transparent;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-primary);
  text-decoration: none;
  transition: all 0.2s ease;
  white-space: nowrap;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.card-action-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.4);
}

.card-action-btn.primary {
  background: #00d9ff;
  border-color: #00d9ff;
  color: #0f0f0f;
  font-weight: 700;
}

.card-action-btn.primary:hover {
  background: #00ffff;
  box-shadow: 0 0 16px rgba(0, 217, 255, 0.3);
}
</style>
{% endblock %}
