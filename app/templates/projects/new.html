{% extends "base.html" %}
{% block title %}New project - AgentFlow{% endblock %}
{% block content %}
  <h1>New project</h1>
  <form class="stacked" method="post">
    <label>Name
      <input type="text" name="name" required>
    </label>
    <label>Description
      <textarea name="description" rows="4"></textarea>
    </label>
    <button type="submit">Create project</button>
  </form>
{% endblock %}
