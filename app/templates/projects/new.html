{% extends "base.html" %}
{% block title %}New project - AgentFlow{% endblock %}
{% block content %}
  <h1>New project</h1>
  <form class="stacked" method="post" id="projectForm">
    <fieldset>
      <legend>Project details</legend>
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Description
        <textarea name="description" rows="4"></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>Primary repository location</legend>
      <label>Repository name
        <input type="text" name="repo_name" placeholder="e.g., main, src, codebase">
      </label>
      <label>Repository path
        <div class="input-with-action">
          <input type="text" name="repo_path" id="repoPath" placeholder="e.g., /home/user/my-project">
          <button type="button" id="browseBtn">Browse</button>
        </div>
      </label>
    </fieldset>

    <button type="submit">Create project</button>
  </form>

  <div id="locationModal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="locationModalTitle">
      <h2 id="locationModalTitle">Select Repository Location</h2>

      <div class="input-with-action">
        <input type="text" id="currentPath" readonly>
        <button type="button" id="upBtn">↑ Up</button>
      </div>

      <div id="dirList" class="dir-list">
        <p>Loading...</p>
      </div>

      <div class="modal-actions">
        <button type="button" id="selectBtn">Select</button>
        <button type="button" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let currentBrowsePath = null;
    let selectedPath = null;

    const modal = document.getElementById('locationModal');
    const browseBtn = document.getElementById('browseBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const selectBtn = document.getElementById('selectBtn');
    const upBtn = document.getElementById('upBtn');
    const currentPathEl = document.getElementById('currentPath');
    const dirListEl = document.getElementById('dirList');
    const repoPathInput = document.getElementById('repoPath');

    browseBtn.addEventListener('click', () => {
      modal.hidden = false;
      currentBrowsePath = '/home/devadmin';
      selectedPath = currentBrowsePath;
      loadDirectory(currentBrowsePath);
    });

    cancelBtn.addEventListener('click', () => {
      modal.hidden = true;
    });

    selectBtn.addEventListener('click', () => {
      if (selectedPath) {
        repoPathInput.value = selectedPath;
      }
      modal.hidden = true;
    });

    upBtn.addEventListener('click', () => {
      if (currentBrowsePath && currentBrowsePath !== '/') {
        const parent = currentBrowsePath.substring(0, currentBrowsePath.lastIndexOf('/')) || '/';
        loadDirectory(parent);
      }
    });

    function loadDirectory(path) {
      currentBrowsePath = path;
      selectedPath = path;
      currentPathEl.value = path;
      dirListEl.innerHTML = '<p>Loading...</p>';

      fetch(`/api/directories?path=${encodeURIComponent(path)}`)
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            dirListEl.innerHTML = `<p class="text-danger">Error: ${agentflowEscapeHtml(String(data.error))}</p>`;
            return;
          }

          const dirs = data.directories || [];
          if (dirs.length === 0) {
            dirListEl.innerHTML = '<p class="text-muted">No subdirectories</p>';
          } else {
            dirListEl.innerHTML = dirs.map(dir => `
              <div class="dir-item" data-path="${agentflowEscapeHtml(dir.path)}">
                📁 ${agentflowEscapeHtml(dir.name)}
              </div>
            `).join('');

            document.querySelectorAll('.dir-item').forEach(el => {
              el.addEventListener('click', () => {
                loadDirectory(el.dataset.path);
              });
            });
          }
        })
        .catch(err => {
          dirListEl.innerHTML = `<p class="text-danger">Error: ${agentflowEscapeHtml(err.message)}</p>`;
        });
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.hidden = true;
      }
    });
  </script>
{% endblock %}
